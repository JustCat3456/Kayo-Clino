<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 108 108">
  <defs>
    <clipPath id="squircle">
      <rect x="4" y="4" width="100" height="100" rx="24" ry="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Background: Deep Okinawa Ocean Slate -->
    <rect x="0" y="0" width="108" height="108" fill="#0B1120" />

    <!-- Kayo Formation (嘉陽層) Tilted Turbidite Strata Bands -->
    <polygon points="0,76 108,32 108,108 0,108" fill="#2A1D00" />
    <polygon points="0,88 108,44 108,108 0,108" fill="#422C00" />
    <polygon points="0,100 108,56 108,108 0,108" fill="#5E4200" />

    <!-- Clinometer Compass Dial Base -->
    <circle cx="54" cy="54" r="31" fill="#111827" />

    <!-- Bedding Plane Cross-Section Inside Dial (#5E4200) -->
    <path d="M26,66 L80,42 A30,30 0 0,1 26,66 Z" fill="#5E4200" />

    <!-- Outer Compass Ring (Strike Cyan #38BDF8) -->
    <circle cx="54" cy="54" r="30" fill="none" stroke="#38BDF8" stroke-width="3.2" />

    <!-- Inner Bullseye Ring -->
    <circle cx="54" cy="54" r="13" fill="none" stroke="#475569" stroke-width="1.2" />

    <!-- N/E/S/W Cardinal Ticks -->
    <path d="M54,24 L54,29 M54,79 L54,84 M24,54 L29,54 M79,54 L84,54"
          stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" />

    <!-- Dip Vector (Amber Gold #FBBF24) -->
    <line x1="54" y1="54" x2="63" y2="72" stroke="#FBBF24" stroke-width="3.8" stroke-linecap="round" />
    <circle cx="63" cy="72" r="3.2" fill="#FBBF24" />

    <!-- Strike Line (Sky Cyan #38BDF8) -->
    <line x1="29" y1="65.5" x2="79" y2="42.5" stroke="#38BDF8" stroke-width="4.0" stroke-linecap="round" />

    <!-- Magnetic North Pointer (Red #EF4444) -->
    <polygon points="54,21 59,32 54,29.5 49,32" fill="#EF4444" />

    <!-- Bullseye Spirit Level Bubble (Emerald Green #10B981) -->
    <circle cx="54" cy="54" r="4.8" fill="#10B981" />
    <circle cx="52.5" cy="52.5" r="1.4" fill="#FFFFFF" />
  </g>
</svg>
