name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk kayo-clino-${{ github.ref_name }}.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: kayo-clino-${{ github.ref_name }}.apk
          name: Kayo-Clino ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🌺 Kayo-Clino（地学クリノメーター） ${{ github.ref_name }}
            
            Android端末向けの地学クリノメーター公式リリースです。
            
            #### インストール方法
            1. 下記の Assets から `kayo-clino-${{ github.ref_name }}.apk` をAndroid端末にダウンロードしてください。
            2. ダウンロード完了後、APKファイルを開いてインストールしてください（「不明なアプリのインストール」の許可が必要です）。
            
            #### 主な機能・v1.1.0 ハイライト
            - 🌺 **沖縄県名護市「嘉陽層（Kayo Formation）」にちなむ『Kayo-Clino』へのブランド刷新＆新アプリアイコン**
            - 🧭 **面測定（背面密着）& 側面測定（伝統式）**、日本式（E/W逆転目盛り）・右手則(RHR)・Dip/DipDir 表記切替
            - 🛰️ **GPS + 世界磁気モデル (WMM)** による現在地の磁気偏角自動計算
            - 📐 **背面カメラ出っ張り「水平ゼロ点補正」**
            - 🔊 **アクセシビリティ**：音量キー連動 HOLD、音声読み上げ (TTS)、HOLD 完了／解除の振動パターン識別
            - 📓 **デジタル野帳・設定データの端末内永続化** ＆ CSV エクスポート
            - 🌍 **初回オンボーディングカルーセル ＆ 6言語（日・英・繁・簡・韓・西）フラットJSON対応**
            - 🪨 **構造地質コラム「What is "Kayo"?」**：嘉陽層のタービダイト・シェブロン褶曲の学術解説と露頭写真（Wikimedia Commons 引用）
